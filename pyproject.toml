[project]
name = "deep-research-agent"
version = "1.0.0"
description = "AI-powered deep research application using multi-agent orchestration"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.91.0",
    "openai-agents>=0.0.19",
    "python-dotenv>=1.1.1",
    "gradio>=5.34.2",
    "sendgrid>=6.11.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
